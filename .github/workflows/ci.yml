name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: tests (race detector, fault injection, linearizability)
        run: go test -race -count=1 -timeout 15m ./...

  cluster:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start 3-node cluster
        run: docker compose up --build -d
      - name: Smoke test through a follower redirect
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8001/healthz && break; sleep 1; done
          sleep 3
          docker compose run --rm bench -mode write -c 8 -d 5s
          docker compose run --rm bench -mode read -c 8 -d 5s
      - if: always()
        run: docker compose logs --tail 50
